<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Shannon Steen — vue mobile</title>
<style>
  /* Affiche le site dans un téléphone, en vrai viewport de 380 px (les media queries mobiles s'appliquent). Le téléphone s'adapte à la hauteur de la fenêtre : seule la page dans l'écran défile. Repris du cadre mobile de la présentation EP. */
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: #eef0f0; display: flex; align-items: center; justify-content: center; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .phone { position: relative; flex: none; width: 408px; height: 844px; box-sizing: border-box; padding: 14px; background: #111; border-radius: 62px; box-shadow: 0 0 0 2px #333 inset, 0 24px 60px rgba(0,0,0,.28); transform-origin: center; }
  .screen { position: relative; width: 380px; height: 816px; background: #fff; border-radius: 48px; overflow: hidden; display: flex; flex-direction: column; }
  .status { flex: none; height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; font-size: 15px; font-weight: 600; color: #111; background: #fff; }
  .status .island { position: absolute; left: 50%; top: 10px; width: 110px; height: 30px; margin-left: -55px; background: #111; border-radius: 15px; }
  .status .sys { letter-spacing: 1px; }
  iframe { flex: 1; width: 380px; border: 0; background: #fff; }
  .home-bar { flex: none; height: 24px; background: #fff; display: flex; align-items: center; justify-content: center; }
  .home-bar::after { content: ""; width: 128px; height: 5px; border-radius: 3px; background: #111; }
</style>
</head>
<body>
<div class="phone" id="phone"><div class="screen">
  <div class="status"><span>9:41</span><span class="island"></span><span class="sys">5G ▮▮▮</span></div>
  <iframe id="f" title="Mobile page"></iframe>
  <div class="home-bar"></div>
</div></div>
<script>
  // pages du même dossier uniquement (pas d'URL externe)
  const p = new URLSearchParams(location.search).get('p') || 'index.html';
  const target = /^[\w.-]+\.html(\?[\w=&.%:-]*)?$/.test(p) ? p : 'index.html';
  // sur un vrai téléphone, la page est déjà la vue mobile : pas besoin du cadre
  if (window.innerWidth < 500 && window.top === window) location.replace(target); else document.getElementById('f').src = target;
  // le téléphone s'adapte toujours à la hauteur de la fenêtre (pas de défilement de la page)
  const phone = document.getElementById('phone');
  const fit = () => { phone.style.transform = 'scale(' + Math.min(1, (innerHeight - 32) / 844, (innerWidth - 32) / 408) + ')'; };
  fit(); addEventListener('resize', fit);
</script>
</body>
</html>
